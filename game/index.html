<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaultbreak — The Meridian Job</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* The controls, on the page for assistive tech and the dossier's outline. */
  #controls { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<noscript><p>Vaultbreak needs JavaScript to play — please enable it and reload.</p></noscript>
<canvas id="game" width="1280" height="720" aria-label="Vaultbreak: a top-down stealth heist. Cross each floor, grab loot, crack the vault and reach the getaway van without filling the alarm meter. Press B for Blackout Mode: the lights die, vision cones shorten, and loot pays 15 percent more."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<p id="controls">Move with WASD or the arrow keys. Hold Shift to sneak. Hold E to grab loot, crack the vault or work a camera panel. Click to throw a coin. Press Q for the EMP. Press B for Blackout Mode — the lights die, guard and camera cones shorten, and loot pays 15% more. Press P to pause.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
